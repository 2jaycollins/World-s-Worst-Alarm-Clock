; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Custom no-OTA partition: 2MB app (fits firmware + the ~0.8MB Bluetooth stack)
; + 1.875MB LittleFS for sounds. See partitions_bt.csv.
board_build.partitions = partitions_bt.csv
lib_deps =
    olikraus/U8g2
    adafruit/RTClib
    madhephaestus/ESP32Encoder
    earlephilhower/ESP8266Audio @ 1.9.7
    bblanchon/ArduinoJson
    knolleary/PubSubClient
    ; A2DP Bluetooth sink, pinned to v1.7.4 (classic set_pin_config API; newer
    ; master won't compile on this board's GCC 8.4 toolchain -- bare min() error).
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.7.4
build_flags =
    -DARDUINO_ARCH_ESP32
    -DDEBUG_MODE ;remove this to disable debug prints
    ; Helix MP3 decode runs off loop()'s task stack; the 8KB default overflows
    ; and panics on the first MP3 frame. 16KB gives it room. Harmless for WAV.
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384